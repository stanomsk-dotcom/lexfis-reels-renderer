name: Render LexFis Reel

on:
  workflow_dispatch:
    inputs:
      title:
        description: Reel title in Russian
        required: true
        type: string
      voiceover:
        description: Full Russian voiceover script
        required: true
        type: string
      caption:
        description: Separate publication description
        required: true
        type: string
      visual_prompt:
        description: Visual direction in Russian; used for local vector scenes
        required: false
        type: string
      media_json:
        description: Optional JSON array of 4-6 public image/video URLs; empty array creates local vector scenes
        required: false
        default: '[]'
        type: string
      audio_url:
        description: Optional public Russian narration audio URL
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lexfis-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core librsvg2-bin
      - name: Test subtitle timing and local scenes
        run: python3 -m unittest discover -s renderer -v
      - name: Prepare input
        env:
          TITLE: ${{ inputs.title }}
          VOICEOVER: ${{ inputs.voiceover }}
          CAPTION: ${{ inputs.caption }}
          VISUAL_PROMPT: ${{ inputs.visual_prompt }}
          MEDIA_JSON: ${{ inputs.media_json }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: python renderer/build_input.py
      - name: Render MP4
        run: python renderer/render.py --input input.json --output output/lexfis-reel.mp4
      - name: Verify MP4 streams and dimensions
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/lexfis-reel.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of json output/lexfis-reel.mp4
      - name: Deliver MP4 privately to Make for Telegram
        env:
          MAKE_REEL_WEBHOOK_URL: ${{ secrets.MAKE_REEL_WEBHOOK_URL }}
          TITLE: ${{ inputs.title }}
          CAPTION: ${{ inputs.caption }}
          MP4_PATH: output/lexfis-reel.mp4
        run: |
          test -n "$MAKE_REEL_WEBHOOK_URL"
          curl --fail --silent --show-error --max-time 170 \
            -X POST "$MAKE_REEL_WEBHOOK_URL" \
            -F "file=@$MP4_PATH;type=video/mp4" \
            -F "title=$TITLE" \
            -F "caption=$CAPTION"
